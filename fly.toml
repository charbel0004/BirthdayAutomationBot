app = "backend-hidden-fog-2243"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  DATA_FILE = "/data/store.json"
  BOT_TIMEZONE = "Asia/Beirut"
  BIRTHDAY_SCHEDULER_ENABLED = "false"

[http_service]
  internal_port = 4000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "get"
  path = "/api/health"
  protocol = "http"
  timeout = "5s"

[[mounts]]
  source = "backend_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
